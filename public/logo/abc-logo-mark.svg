<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" role="img" aria-label="ABC Mark">
  <defs>
    <linearGradient id="abcMarkGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>
  <!-- ABC Brand Mark v2: the letters A, B, C inside three ascending architectural buildings -->
  <rect x="4" y="4" width="88" height="88" rx="22" fill="url(#abcMarkGrad)"/>
  <g fill="#ffffff">
    <rect x="16" y="58" width="18" height="26" rx="5"/>
    <rect x="39" y="46" width="18" height="38" rx="5"/>
    <rect x="62" y="34" width="18" height="50" rx="5"/>
  </g>
  <g fill="#0f172a" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-weight="800" text-anchor="middle">
    <text x="25" y="78" font-size="20">A</text>
    <text x="48" y="72" font-size="20">B</text>
    <text x="71" y="66" font-size="20">C</text>
  </g>
</svg>
